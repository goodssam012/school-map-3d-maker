<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>학교 3D 안내도</title>
  <meta name="description" content="학교 건물과 교실 위치를 3D로 살펴보는 안내도">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <h1 id="schoolName">학교 안내도</h1>
      <div class="search">
        <input id="search" type="search" placeholder="교실, 건물 찾기" aria-label="교실이나 건물 찾기" autocomplete="off">
        <div id="searchResults" class="search-results" hidden></div>
      </div>
    </header>

    <main class="layout">
      <section id="stage" class="stage" aria-label="3D 학교 지도">
        <canvas id="scene"></canvas>
        <div id="labels" class="labels"></div>
        <div class="view-controls">
          <button id="btnHome" type="button">전체 보기</button>
          <button id="btnTop" type="button">위에서 보기</button>
          <button id="btnSpin" type="button" aria-pressed="false">자동 회전</button>
        </div>
      </section>
      <aside id="panel" class="panel" aria-live="polite"></aside>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
  <script src="data/school-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
