<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>학교 3D 안내도 제작기</title>
<style id="app-style">
:root {
  --bg: #f4f2ec; --surface: #fff; --ink: #1f2629; --muted: #5d686d; --line: #dedbd2;
  --accent: #17695c; --accent-soft: #dff0eb; --danger: #b3382c; --radius: 8px;
  font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif; color: var(--ink);
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: var(--bg); }
button, input, select { font: inherit; color: inherit; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
#app { height: 100dvh; display: flex; flex-direction: column; }
.top { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 16px; background: var(--surface); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.top h1 { margin: 0; font-size: 18px; white-space: nowrap; }
.steps { display: flex; gap: 4px; margin: 0 auto; padding: 0; list-style: none; }
.steps button { display: flex; align-items: center; gap: 6px; border: 0; background: none; padding: 0 10px; font-weight: 700; color: var(--muted); }
.steps b { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--line); color: var(--ink); font-size: 12px; }
.steps button[aria-current="step"] { background: var(--accent-soft); color: var(--accent); }
.steps button[aria-current="step"] b { background: var(--accent); color: #fff; }
.tools { display: flex; gap: 6px; }
button { min-height: 36px; padding: 0 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
button.danger { color: var(--danger); }
.layout { flex: 1; min-height: 0; display: grid; grid-template-columns: 370px minmax(0, 1fr); }
.panel { overflow-y: auto; padding: 18px 16px 28px; background: var(--surface); border-right: 1px solid var(--line); }
.panel h2 { margin: 0 0 4px; font-size: 21px; }
.panel h3 { margin: 20px 0 8px; font-size: 15px; }
.panel p { margin: 0 0 10px; color: var(--muted); font-size: 14px; line-height: 1.55; }
.field { display: grid; gap: 4px; margin-bottom: 10px; font-size: 13px; font-weight: 700; }
.field input, .field select, .room select, .room input { width: 100%; height: 36px; padding: 0 9px; border: 1px solid var(--line); border-radius: 6px; background: #fff; font-weight: 400; }
.field input[type=color] { padding: 2px; }
.cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.cols.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.card { display: block; height: auto; padding: 6px; text-align: left; }
.card svg { display: block; width: 100%; height: auto; border-radius: 5px; }
.card strong { display: block; margin-top: 5px; font-size: 14px; }
.card small { display: block; color: var(--muted); line-height: 1.35; padding-bottom: 2px; }
.card[aria-pressed="true"], .chip[aria-pressed="true"], .row[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.palette { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.palette button { display: grid; justify-items: center; gap: 3px; height: 66px; padding: 5px 2px; font-size: 13px; }
.palette i { width: 26px; height: 26px; border-radius: 5px; border: 1px solid rgb(0 0 0 / .18); }
.palette button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
.chip { min-height: 34px; padding: 0 10px; font-size: 14px; }
.inspector { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
.actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.next { width: 100%; margin-top: 18px; height: 42px; }
.room { display: grid; grid-template-columns: 42px minmax(0, 1fr) 92px 34px; align-items: center; gap: 5px; padding: 4px; border-radius: 6px; }
.room.active { background: var(--accent-soft); }
.room code { font-size: 13px; color: var(--muted); text-align: center; }
.room button { min-height: 34px; padding: 0; }
.list { display: grid; gap: 6px; }
.row { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; padding: 6px 10px; text-align: left; }
.row span { color: var(--muted); font-size: 13px; line-height: 1.35; }
.row strong { flex: none; }
.stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; background: #d9e9ee; }
#scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
.stage.placing #scene { cursor: copy; }
.stage.can-pick #scene { cursor: pointer; }
.stage.dragging #scene { cursor: grabbing; }
.labels { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.pin { position: absolute; left: 0; top: 0; min-height: 26px; padding: 0 8px; border: 1px solid rgb(0 0 0 / .18); border-radius: 99px; background: #fff; font-size: 12px; font-weight: 700; white-space: nowrap; pointer-events: auto; box-shadow: 0 2px 5px rgb(0 0 0 / .2); }
.pin.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.stage.no-pin-click .pin { pointer-events: none; }
.view { position: absolute; right: 12px; bottom: 12px; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.view button { box-shadow: 0 2px 6px rgb(0 0 0 / .16); }
.hint { position: absolute; left: 12px; top: 12px; max-width: calc(100% - 24px); padding: 7px 11px; border-radius: var(--radius); background: rgb(31 38 41 / .88); color: #fff; font-size: 13px; pointer-events: none; }
.finder { position: absolute; z-index: 12; top: 12px; right: 12px; width: min(300px, calc(100% - 24px)); }
.finder input { width: 100%; height: 40px; padding: 0 12px; border: 1px solid var(--line); border-radius: var(--radius); background: #fff; box-shadow: 0 3px 10px rgb(0 0 0 / .18); }
.find-results { margin-top: 4px; max-height: 260px; overflow-y: auto; border: 1px solid var(--line); border-radius: var(--radius); background: #fff; box-shadow: 0 6px 18px rgb(0 0 0 / .2); }
.find-results button { display: flex; justify-content: space-between; gap: 10px; width: 100%; min-height: 38px; border: 0; border-radius: 0; text-align: left; align-items: center; }
.find-results button:hover, .find-results button:focus { background: var(--accent-soft); }
.find-results small { color: var(--muted); white-space: nowrap; }
.find-results p { margin: 0; padding: 10px 12px; color: var(--muted); font-size: 14px; }
.spot { position: absolute; left: 0; top: 0; padding: 4px 9px; border-radius: 6px; background: #d92d20; color: #fff; font-size: 13px; font-weight: 800; white-space: nowrap; box-shadow: 0 2px 7px rgb(0 0 0 / .3); }
.plan { position: relative; width: 100%; border: 2px solid #5d686d; border-bottom-width: 1px; background-color: #f7f5ef; background-image: linear-gradient(to right, #d5d1c6 1px, transparent 1px), linear-gradient(to bottom, #d5d1c6 1px, transparent 1px); background-size: calc(100% / var(--c)) calc(100% / var(--r)); touch-action: none; cursor: crosshair; user-select: none; }
.plan-room { position: absolute; min-height: 0; padding: 1px; overflow: hidden; border: 1px solid #5d686d; border-radius: 2px; color: var(--ink); font-size: 11px; font-weight: 700; line-height: 1.15; cursor: move; word-break: keep-all; }
.plan-room.active { z-index: 2; border-color: #d92d20; box-shadow: inset 0 0 0 1px #d92d20; }
.plan-handle { position: absolute; right: 0; bottom: 0; width: 13px; height: 13px; background: #d92d20; cursor: nwse-resize; }
.plan-preview { position: absolute; z-index: 3; pointer-events: none; background: rgb(23 105 92 / .35); border: 2px solid var(--accent); }
.plan-preview.bad { background: rgb(217 45 32 / .35); border-color: #d92d20; }
.plan-hall { padding: 3px; border: 2px solid #5d686d; border-top: 0; background: #dfe3df; color: var(--muted); font-size: 12px; text-align: center; }
.plan-note { margin: 6px 0 0 !important; font-size: 13px !important; }
.warn { color: var(--danger) !important; font-weight: 700; }
.room.unplaced code { color: var(--danger); font-weight: 800; }
.door-plan { position: relative; padding: 20px 22px; border: 1px solid var(--line); border-radius: 6px; background: #eef3e8; touch-action: none; cursor: crosshair; user-select: none; }
.door-body { position: relative; margin: 0 auto; display: grid; place-items: center; border: 2px solid #5d686d; background: #f7f5ef; color: var(--muted); font-size: 12px; }
.door-dot { position: absolute; width: 20px; height: 20px; min-height: 0; padding: 0; border: 2px solid #fff; border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 1px 4px rgb(0 0 0 / .45); cursor: grab; }
.door-dot:hover:not(:disabled) { border-color: #fff; }
.door-dot.center { background: #17695c; }
.door-dot.door { background: #2f6fb3; }
.door-dot.exit { background: #e07b12; }
.door-dot.active { outline: 3px solid #d92d20; outline-offset: 1px; }
.door-legend { display: flex; flex-wrap: wrap; gap: 10px; margin: 6px 0; color: var(--muted); font-size: 12px; }
.door-legend i { display: inline-block; width: 10px; height: 10px; margin-right: 4px; border-radius: 50%; }
.door-row { display: grid; grid-template-columns: minmax(0, 1fr) 86px 66px 32px; gap: 4px; align-items: center; padding: 3px; border-radius: 6px; }
.door-row.active { background: var(--accent-soft); }
.door-row input, .door-row select { width: 100%; height: 34px; padding: 0 5px; border: 1px solid var(--line); border-radius: 6px; background: #fff; font-size: 13px; }
.door-row button { min-height: 34px; padding: 0; }
.toast { position: fixed; z-index: 40; left: 50%; bottom: 24px; transform: translateX(-50%); max-width: calc(100vw - 32px); padding: 10px 16px; border-radius: var(--radius); background: var(--ink); color: #fff; }
.fatal { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; background: var(--bg); }
@media (max-width: 900px) {
  .top h1 { display: none; }
  .steps { margin: 0; order: 3; width: 100%; overflow-x: auto; }
  .steps button { white-space: nowrap; padding: 0 7px; }
  .tools { margin-left: auto; }
  .layout { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) minmax(220px, 45%); }
  .stage { grid-row: 1; }
  .panel { grid-row: 2; border-right: 0; border-top: 1px solid var(--line); }
  .cards { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .card small { display: none; }
}
</style>
</head>

  function buildEntrance(parent, it, st, door) {

  function buildSite(it, g) {

  function createGroup(it) {

    const type = CAT[it.kind].g;
    if (type === 'building') buildBuilding(it, g);

    return g;
  }

  const built = new Map();

  function buildGround() {
    disposeTree(groundGroup);

    base.rotation.x = -Math.PI / 2;

  function rebuildAll() {
    [...built.keys()].forEach(removeBuilt);

    buildInterior();
    applyFocus();

  }

  /* ========== 내부 교실과 3D 표찰 ========== */
  const plates = new Map();
  let interior = null;
  const roomsOf = (it, f) => (it.rooms && it.rooms[f]) || [];
  const roomCode = (f, i) => `${f + 1}${String(i + 1).padStart(2, '0')}`;

  function drawPlate(c, code, name, trim) {
    const g = c.getContext('2d'), W = c.width, H = c.height, bandW = 150;
    g.fillStyle = '#fbfaf5'; g.fillRect(0, 0, W, H);
    g.fillStyle = trim; g.fillRect(0, 0, bandW, H);
    g.fillStyle = inkOn(trim);
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = '800 54px "Malgun Gothic","Apple SD Gothic Neo",sans-serif';
    g.fillText(code, bandW / 2, H / 2 + 3);
    const text = name.trim() || '이름 없음';
    let size = 78;
    do { g.font = `800 ${size}px "Malgun Gothic","Apple SD Gothic Neo",sans-serif`; size -= 2; } while (g.measureText(text).width > W - bandW - 34 && size > 24);
    g.fillStyle = name.trim() ? '#1f2629' : '#8a9195';
    g.fillText(text, bandW + (W - bandW) / 2, H / 2 + 3, W - bandW - 24);
  }
  function addPlate(parent, it, f, i, room, doorX, wallZ, st) {
    const c = document.createElement('canvas');
    c.width = 720; c.height = 180;
    const code = roomCode(f, i);
    drawPlate(c, code, room.name, st.trim);
    const tex = new THREE.CanvasTexture(c);
    tex.encoding = THREE.sRGBEncoding;
    tex.anisotropy = 8;
    const mat = () => new THREE.MeshBasicMaterial({ map: tex, toneMapped: false });
    const y = 2.72;
    box(parent, 2.12, .59, .06, M('#39454a'), doorX, y, wallZ + .04, true);
    const front = new THREE.Mesh(new THREE.PlaneGeometry(2, .5), mat());
    front.position.set(doorX, y, wallZ + .08);
    parent.add(front);
    const px = doorX + 1.32;
    box(parent, .05, .05, .96, M('#39454a'), px, y + .24, wallZ + .48, true);
    box(parent, .04, .4, .92, M('#39454a'), px, y, wallZ + .5, true);
    [1, -1].forEach((s) => {
      const side = new THREE.Mesh(new THREE.PlaneGeometry(.88, .22), mat());
      side.rotation.y = s * Math.PI / 2;
      side.position.set(px + s * .025, y, wallZ + .5);
      parent.add(side);
    });
    plates.set(room.id, { canvas: c, tex, code, trim: st.trim });
  }
  function updatePlate(room) {
    const p = plates.get(room.id);
    if (!p) return;
    drawPlate(p.canvas, p.code, room.name, p.trim);
    p.tex.needsUpdate = true;
  }
  function furnish(parent, room, x0, z0, rw, rd) {
    const add = (list, x, z) => list.push([x, z]);
    const desks = [], chairs = [], tables = [];
    const ix0 = x0 + .8, iw = rw - 1.6, iz0 = z0 + 1.7, id = rd - 2.5;
    if (iw < 1.4 || id < 1) return;
    if (room.type === 'class') {
      const cols = clamp(Math.floor(iw / 1.35), 1, 7), rows = clamp(Math.floor(id / 1.3), 1, 6);
      for (let c = 0; c < cols; c++) for (let r = 0; r < rows; r++) {
        const x = ix0 + iw * (c + .5) / cols, z = iz0 + id * (r + .5) / rows;
        add(desks, x, z); add(chairs, x, z + .42);
      }
      box(parent, Math.min(rw * .55, 6), 1.2, .06, M('#2f5d4b'), x0 + rw / 2, 1.75, z0 + .2, true);
      box(parent, 1.5, .8, .6, M('#8a6a4c'), x0 + rw / 2, .46, z0 + 1.05, true);
    } else if (room.type === 'lab') {
      const cols = clamp(Math.floor(iw / 3.4), 1, 5), rows = clamp(Math.floor(id / 2.5), 1, 4);
      for (let c = 0; c < cols; c++) for (let r = 0; r < rows; r++) add(tables, ix0 + iw * (c + .5) / cols, iz0 + id * (r + .5) / rows);
    } else if (room.type === 'office') {
      const cols = clamp(Math.floor(iw / 2), 1, 5), rows = clamp(Math.floor(id / 2.1), 1, 3);
      for (let c = 0; c < cols; c++) for (let r = 0; r < rows; r++) {
        const x = ix0 + iw * (c + .5) / cols, z = iz0 + id * (r + .5) / rows;
        add(desks, x, z); add(chairs, x, z + .45);
      }
      box(parent, Math.min(rw - .6, 5), 1.9, .4, M('#a58a6c'), x0 + rw / 2, 1, z0 + .35, true);
    } else if (room.type === 'wc') {
      const n = clamp(Math.floor(rw / 1.3), 1, 6);
      for (let i = 0; i < n; i++) box(parent, rw / n - .12, 1.9, 1.5, M('#9fc0cf'), x0 + rw * (i + .5) / n, 1, z0 + .95, true);
    }
    const inst = (list, w, h, d, y, color) => {
      if (!list.length) return;
      const m = new THREE.InstancedMesh(new THREE.BoxGeometry(w, h, d), M(color), list.length);
      const mx = new THREE.Matrix4();
      list.forEach(([x, z], k) => m.setMatrixAt(k, mx.makeTranslation(x, y, z)));
      m.instanceMatrix.needsUpdate = true;
      parent.add(m);
    };
    inst(desks, .85, .72, .55, .42, '#b58e62');
    inst(chairs, .4, .46, .4, .3, '#55707c');
    inst(tables, 2.4, .86, 1.3, .49, '#6d8a84');
  }
  function roomRect(it, room) {
    const g = gridOf(it), a = room.cell;
    const x0 = -it.w / 2 + a.c * g.cw, z0 = -it.d / 2 + a.r * g.ch, w = a.cs * g.cw, d = a.rs * g.ch;
    return { x0, z0, w, d, x1: x0 + w, z1: z0 + d, cx: x0 + w / 2, cz: z0 + d / 2 };
  }
  function doorOf(it, f, room) {
    const g = gridOf(it), a = room.cell, rect = roomRect(it, room), others = roomsOf(it, f).filter((o) => o.id !== room.id && o.cell);
    const free = (c, r) => {
      if (c < 0 || c >= g.cols || r < 0) return false;
      if (r >= g.rows) return true;
      return !others.some((o) => c >= o.cell.c && c < o.cell.c + o.cell.cs && r >= o.cell.r && r < o.cell.r + o.cell.rs);
    };
    const colX = (c) => -it.w / 2 + (c + .5) * g.cw, rowZ = (r) => -it.d / 2 + (r + .5) * g.ch;
    for (let c = a.c; c < a.c + a.cs; c++) if (free(c, a.r + a.rs)) return { side: 'front', x: colX(c), z: rect.z1, ry: 0, nx: 0, nz: 1 };
    for (let r = a.r + a.rs - 1; r >= a.r; r--) if (free(a.c - 1, r)) return { side: 'left', x: rect.x0, z: rowZ(r), ry: -Math.PI / 2, nx: -1, nz: 0 };
    for (let r = a.r + a.rs - 1; r >= a.r; r--) if (free(a.c + a.cs, r)) return { side: 'right', x: rect.x1, z: rowZ(r), ry: Math.PI / 2, nx: 1, nz: 0 };
    for (let c = a.c; c < a.c + a.cs; c++) if (free(c, a.r - 1)) return { side: 'back', x: colX(c), z: rect.z0, ry: Math.PI, nx: 0, nz: -1 };
    return { side: 'front', x: colX(a.c), z: rect.z1, ry: 0, nx: 0, nz: 1 };
  }
  function buildInterior() {
    plates.clear();
    if (interior) {
      disposeTree(interior);
      if (interior.parent) interior.parent.remove(interior);
      interior = null;
    }
    const it = getItem(focus.id);
    if (!isBuilding(it) || focus.floor === null || !built.has(it.id)) { updateMarker(); return; }
    const f = focus.floor, rooms = roomsOf(it, f), st = styleOf(it);
    const g = new THREE.Group();
    g.position.y = f * it.h;
    const { w, d } = it, h = Math.min(it.h, 3.6), z0 = -d / 2, z1 = d / 2 - CORR;
    const wallM = M(st.wall === '#f1f0ea' ? '#dfddd4' : '#f0ece2');

    box(g, .2, h, d, wallM, -w / 2, h / 2, 0);
    box(g, .2, h, d, wallM, w / 2, h / 2, 0);
    box(g, w, .95, .12, M(st.trim), 0, .5, d / 2 - .05);
    rooms.forEach((room, i) => {
      if (!room.cell) return;
      const r = roomRect(it, room), door = doorOf(it, f, room);
      box(g, r.w - .16, .02, r.d - .16, M(ROOM_TINT[room.type] || ROOM_TINT.etc), r.cx, .115, r.cz, true);
      box(g, r.w, h, .16, wallM, r.cx, h / 2, r.z0);
      box(g, r.w, h, .16, wallM, r.cx, h / 2, r.z1);
      box(g, .16, h, r.d, wallM, r.x0, h / 2, r.cz);
      box(g, .16, h, r.d, wallM, r.x1, h / 2, r.cz);
      furnish(g, room, r.x0, r.z0, r.w, r.d);
      const dg = new THREE.Group();
      dg.position.set(door.x, 0, door.z);
      dg.rotation.y = door.ry;
      box(dg, 1.15, 2.15, .08, M('#7c5a3c'), 0, 1.2, .12, true);
      box(dg, .34, .62, .09, M('#a8cbd8'), .22, 1.62, .125, true);
      addPlate(dg, it, f, i, room, 0, .09, st);
      g.add(dg);
      if (door.side === 'front' && r.w > 5) {

      }
    });
    built.get(it.id).g.add(g);
    interior = g;
    updateMarker();
  }

  /* ---------- 위치 점 ---------- */
  let plateRoom = null;
  const markerMat = (color, opacity) => new THREE.MeshBasicMaterial({ color, transparent: true, opacity, depthTest: false, depthWrite: false });
  const marker = new THREE.Group();
  const markerDot = new THREE.Mesh(new THREE.SphereGeometry(1, 20, 14), markerMat('#e5261a', 1));
  const markerRing = new THREE.Mesh(new THREE.RingGeometry(.82, 1, 40).rotateX(-Math.PI / 2), markerMat('#e5261a', .8));
  markerDot.renderOrder = 21;
  markerRing.renderOrder = 20;
  marker.add(markerRing, markerDot);
  marker.visible = false;
  overlay.add(marker);
  const spotLabel = el('div', { class: 'spot', hidden: true });
  $('labels').append(spotLabel);
  function focusedRoom() {
    const it = getItem(focus.id);
    if (!isBuilding(it) || focus.floor === null || !focus.room) return null;
    const room = roomsOf(it, focus.floor).find((r) => r.id === focus.room);
    return room ? { it, room } : null;
  }
  function focusedSpot() {
    const it = getItem(focus.id);
    if (!it || !built.has(it.id)) return null;
    if (focus.door && isBuilding(it)) {
      const door = (it.doors || []).find((d) => d.id === focus.door);
      if (!door) return null;
      const p = doorPoint(it, door), out = door.type === 'center' ? 4.4 : 2;
      return { pos: local(it, p.x + p.nx * out, 1.6, p.z + p.nz * out), name: door.name || '출입구' };
    }
    if (isGate(it) && step !== 'place') return { pos: local(it, 0, 2, 2.4), name: it.name };
    return null;
  }
  function updateMarker() {
    const spot = focusedSpot();
    if (spot) {
      marker.visible = true;
      spotLabel.hidden = false;
      marker.position.copy(spot.pos);
      spotLabel.textContent = spot.name;
      return;
    }
    const hit = focusedRoom();
    const show = !!(hit && hit.room.cell && built.has(hit.it.id) && plateRoom !== hit.room.id);
    marker.visible = show;
    spotLabel.hidden = !show;
    if (!show) return;
    const r = roomRect(hit.it, hit.room);
    marker.position.copy(local(hit.it, r.cx, focus.floor * hit.it.h + 1.5, r.cz));
    spotLabel.textContent = hit.room.name.trim() || '이름 없음';
  }
  function animateMarker(now, w, h) {
    if (!marker.visible) return;
    const s = camera.position.distanceTo(marker.position) * .0125;
    const t = reduceMotion ? .45 : (now % 1400) / 1400;
    markerDot.scale.setScalar(s);
    markerRing.scale.setScalar(s * (1.2 + t * 2.6));
    markerRing.material.opacity = .85 * (1 - t);

    cancelPlace();
    const it = makeItem(kind, 0, 0, { name: uniqueName(kind) });
    placing = { kind, item: it, valid: false };
    focus = { id: null, floor: null, room: null };
    makeGhost();
    updateSelection();
    stage.classList.add('placing');
    updateHint();
    renderPanel();
  }
  function makeGhost() {
    if (ghost) { disposeTree(ghost); overlay.remove(ghost); }
    const it = placing.item;
    ghost = createGroup(it);
    ghost.traverse((o) => {
      if (!o.material) return;
      const conv = (m) => { const c = m.clone(); c.userData = {}; c.transparent = true; c.opacity = .6; if (!m.userData.keep) m.dispose(); return c; };
      o.material = Array.isArray(o.material) ? o.material.map(conv) : conv(o.material);
      o.castShadow = false;
    });
    const pad = new THREE.Mesh(new THREE.PlaneGeometry(it.w + 1, it.d + 1), new THREE.MeshBasicMaterial({ color: '#2fb58f', transparent: true, opacity: .4, depthWrite: false }));
    pad.rotation.x = -Math.PI / 2;
    pad.position.y = .25;
    ghost.add(pad);
    ghost.userData.pad = pad;
    ghost.visible = false;
    overlay.add(ghost);
  }
  function cancelPlace() {
    if (ghost) { disposeTree(ghost); overlay.remove(ghost); ghost = null; }
    const had = !!placing;
    placing = null;
    stage.classList.remove('placing');
    if (had) { updateHint(); if (step === 'place') renderPanel(); }
  }
  function moveGhost(e) {
    const p = groundPoint(e);
    if (!p || !ghost) { if (ghost) ghost.visible = false; return; }
    const it = placing.item;
    [it.x, it.z] = clampPos(it, p.x, p.z);
    ghost.position.set(it.x, 0, it.z);
    ghost.rotation.y = -it.rot * Math.PI / 2;
    ghost.visible = true;
    placing.valid = !overlaps(it, it.x, it.z);
    ghost.userData.pad.material.color.set(placing.valid ? '#2fb58f' : '#e0402d');
  }
  function commitPlace() {
    if (!placing || !ghost.visible) return;
    if (!placing.valid) { toast('다른 건물이나 시설과 겹치는 자리입니다.'); return; }
    const it = placing.item, kind = it.kind;
    project.items.push(it);
    rebuildItem(it);
    commit();
    if (CAT[kind].g === 'prop' && !isGate(it)) {
      const rot = it.rot;
      placing.item = makeItem(kind, it.x, it.z, { name: uniqueName(kind), rot });
      makeGhost();
    } else {
      cancelPlace();
      focus = { id: it.id, floor: null, room: null };
      applyFocus();
      updateSelection();
      renderPanel();
    }
  }

  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
  function setRay(e) {
    const r = canvas.getBoundingClientRect();
    ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, camera);
  }
  function groundPoint(e) {
    setRay(e);
    const p = ray.ray.intersectPlane(groundPlane, new THREE.Vector3());
    return p && Math.abs(p.x) <= GROUND.w / 2 && Math.abs(p.z) <= GROUND.d / 2 ? p : null;
  }
  function visibleChain(o) {
    for (let n = o; n; n = n.parent) if (!n.visible) return false;
    return true;
  }
  function pickHit(e, onlyBuildings) {
    setRay(e);
    const hits = ray.intersectObjects(world.children, true).filter((h) => visibleChain(h.object));
    for (const h of hits) {
      let n = h.object;
      while (n && !n.userData.itemId) n = n.parent;
      if (!n) continue;
      const it = getItem(n.userData.itemId);
      if (it && (!onlyBuildings || isBuilding(it))) return { it, point: h.point };
    }
    return null;
  }
  let down = null;
  canvas.addEventListener('pointerdown', (e) => {
    down = { x: e.clientX, y: e.clientY };
    tween = null;
    if (e.button !== 0 || placing || step !== 'place') return;
    const hit = pickHit(e);
    if (!hit) return;
    const p = groundPoint(e) || hit.point;
    controls.enabled = false;
    drag = { it: hit.it, ox: p.x - hit.it.x, oz: p.z - hit.it.z, sx: hit.it.x, sz: hit.it.z, moved: false };
    if (focus.id !== hit.it.id) {
      focus = { id: hit.it.id, floor: null, room: null };
      applyFocus();
      updateSelection();
      renderPanel();
    }
  }, true);
  canvas.addEventListener('pointermove', (e) => {
    if (placing) { moveGhost(e); return; }
    if (drag) {
      if (!drag.moved && Math.hypot(e.clientX - down.x, e.clientY - down.y) < 5) return;
      drag.moved = true;
      stage.classList.add('dragging');
      const p = groundPoint(e);
      if (!p) return;
      const [x, z] = clampPos(drag.it, p.x - drag.ox, p.z - drag.oz);
      drag.it.x = x; drag.it.z = z;
      built.get(drag.it.id).g.position.set(x, 0, z);
      updateSelection();
      selBox.material.color.set(overlaps(drag.it, x, z) ? '#e0402d' : '#ff5a36');
      return;
    }
    if (e.pointerType === 'mouse' && !e.buttons) {
      stage.classList.toggle('can-pick', !!pickHit(e, step !== 'place'));
    }
  });
  function endPointer(e) {
    if (drag) {
      const d = drag;
      drag = null;
      controls.enabled = true;
      stage.classList.remove('dragging');
      selBox.material.color.set('#ff5a36');
      if (d.moved) {
        if (overlaps(d.it, d.it.x, d.it.z)) {
          d.it.x = d.sx; d.it.z = d.sz;
          built.get(d.it.id).g.position.set(d.sx, 0, d.sz);
          updateSelection();
          toast('겹치는 자리라 원래 위치로 돌렸습니다.');
        } else commit();
      }
      down = null;
      return;
    }
    if (!down || e.type !== 'pointerup') { down = null; return; }
    const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y);
    down = null;
    if (moved > 5 || e.button !== 0) return;
    if (placing) { moveGhost(e); commitPlace(); return; }
    if (step === 'place') {
      if (focus.id) { focus = { id: null, floor: null, room: null }; applyFocus(); updateSelection(); renderPanel(); }
      return;
    }
    if (step === 'style') {
      const hit = pickHit(e, true);
      selectStyleTarget(hit ? hit.it : null, false);
      return;
    }
    if (step === 'rooms' || step === 'done') {
      if (interior && focus.id && focus.floor !== null) {
        const it = getItem(focus.id);
        setRay(e);
        const h = ray.intersectObject(interior, true)[0];
        if (h) {
          const lp = built.get(it.id).g.worldToLocal(h.point.clone());
          const room = roomsOf(it, focus.floor).find((r) => {
            if (!r.cell) return false;
            const a = roomRect(it, r);
            return lp.x >= a.x0 && lp.x <= a.x1 && lp.z >= a.z0 && lp.z <= a.z1;
          });
          if (room) {
            selectFloor(it.id, focus.floor, room.id);
            const row = $('panel').querySelector(`[data-row="${room.id}"]`);
            if (row) row.scrollIntoView({ block: 'nearest' });
          }
          return;
        }
      }
      const hit = pickHit(e, true);
      if (hit) selectFloor(hit.it.id, step === 'rooms' ? 0 : null);
    }
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);
  function onPinClick(id) {
    const it = getItem(id);
    if (!it || step === 'place') return;
    if (isGate(it)) { if (step !== 'style') locateGate(it); return; }
    if (isBuilding(it)) {
      if (step === 'rooms') selectFloor(id, 0);
      else if (step === 'done') selectFloor(id, null);
      else selectStyleTarget(it, true);
    }
  }
  window.addEventListener('keydown', (e) => {
    const typing = /INPUT|SELECT|TEXTAREA/.test(e.target.tagName);
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !typing && !PUB) { e.preventDefault(); undo(); return; }
    if (typing || step !== 'place') return;
    if (e.key === 'Escape') cancelPlace();
    if (e.key.toLowerCase() === 'r' || e.key === 'ㄱ') {
      if (placing) {
        placing.item.rot = (placing.item.rot + 1) % 4;
        ghost.rotation.y = -placing.item.rot * Math.PI / 2;
        const it = placing.item;
        [it.x, it.z] = clampPos(it, it.x, it.z);
        ghost.position.set(it.x, 0, it.z);
        placing.valid = !overlaps(it, it.x, it.z);
        ghost.userData.pad.material.color.set(placing.valid ? '#2fb58f' : '#e0402d');
      } else if (getItem(focus.id)) rotateItem(getItem(focus.id));
    }
    if ((e.key === 'Delete' || e.key === 'Backspace') && getItem(focus.id)) { e.preventDefault(); deleteItem(getItem(focus.id)); }
  });

  /* ========== 교실 찾기 ========== */
  let findTimer;
  function syncFinder() {
    const on = step === 'rooms' || step === 'done';
    $('finder').hidden = !on;
    $('findInput').value = '';
    $('findResults').hidden = true;
  }
  function findHits(q) {
    const hits = [];
    buildings().forEach((b) => {
      if (b.name.toLowerCase().includes(q)) hits.push({ b, f: null, room: null, text: b.name, sub: '건물' });
      for (let f = 0; f < b.floors; f++) roomsOf(b, f).forEach((r) => {
        if (r.name.toLowerCase().includes(q)) hits.push({ b, f, room: r, text: r.name, sub: `${b.name} ${f + 1}층${r.cell ? '' : ' · 위치 미지정'}` });
      });
      (b.doors || []).forEach((d) => {
        const typeName = DOOR_TYPES.find(([v]) => v === d.type)[1];
        if (d.name.toLowerCase().includes(q) || typeName.includes(q)) hits.push({ b, door: d, spot: true, text: d.name, sub: `${b.name} ${typeName}` });
      });
    });
    project.items.filter(isGate).forEach((g) => {
      if (g.name.toLowerCase().includes(q)) hits.push({ b: g, gate: true, spot: true, text: g.name, sub: '학교 출입문' });
    });
    return hits;
  }
  function goToHit(h) {
    $('findResults').hidden = true;
    if (h.gate) locateGate(h.b);
    else if (h.door) locateDoor(h.b, h.door.id);
    else if (h.room) selectFloor(h.b.id, h.f, h.room.id);
    else selectFloor(h.b.id, step === 'rooms' ? 0 : null);
  }
  $('findInput').addEventListener('input', (e) => {
    const q = e.target.value.trim().toLowerCase(), box_ = $('findResults');
    clearTimeout(findTimer);
    box_.replaceChildren();
    box_.hidden = !q;
    if (!q) return;
    const hits = findHits(q);
    if (!hits.length) { box_.append(el('p', {}, '찾는 교실이 없습니다.')); return; }
    hits.slice(0, 10).forEach((h) => box_.append(el('button', { type: 'button', onclick: () => goToHit(h) }, el('span', {}, h.text), el('small', {}, h.sub))));
    const placeHits = hits.filter((h) => h.room || h.spot), exact = placeHits.filter((h) => h.text.toLowerCase() === q);
    const only = exact.length === 1 ? exact[0] : (hits.length === 1 && placeHits.length === 1 ? placeHits[0] : null);
    const here = (h) => (h.room ? focus.room === h.room.id : h.door ? focus.door === h.door.id : focus.id === h.b.id);
    if (only) findTimer = setTimeout(() => { if (!here(only)) goToHit(only); else box_.hidden = true; }, 320);
  });
  $('findInput').addEventListener('keydown', (e) => {
    if (e.isComposing) return;
    if (e.key === 'Enter') {
      const q = e.target.value.trim().toLowerCase();
      if (!q) return;
      clearTimeout(findTimer);
      const hits = findHits(q), first = hits.find((h) => (h.room || h.spot) && h.text.toLowerCase() === q) || hits.find((h) => h.room || h.spot) || hits[0];
      if (first) goToHit(first);
    }
    if (e.key === 'Escape') { clearTimeout(findTimer); e.target.value = ''; $('findResults').hidden = true; }
  });
  document.addEventListener('pointerdown', (e) => { if (!e.target.closest('#finder')) $('findResults').hidden = true; });

  /* ========== 저장·내보내기 ========== */
  function undo() {
    if (history.length < 2) return;
    cancelPlace();
    history.pop();
    project = JSON.parse(history[history.length - 1]);
    if (!getItem(focus.id)) focus = { id: null, floor: null, room: null };
    else if (focus.floor !== null && focus.floor >= getItem(focus.id).floors) focus.floor = 0;
    rebuildAll();
    persist();
    updateTools();
    renderPanel();
  }
  function download(name, text, type) {
    const a = el('a', { href: URL.createObjectURL(new Blob([text], { type })), download: name });
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }
  const safeName = () => (project.name || '학교').replace(/[\\/:*?"<>|]/g, '').trim() || '학교';
  function exportHtml() {
    const close = '<' + '/script>';
    const data = JSON.stringify(project).replace(/</g, '\\u003c');
    const title = (project.name || '학교').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const html = '<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">' +
      `<title>${title} 3D 안내도</title><style>${$('app-style').textContent}</style></head><body>` +
      `<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js">${close}` +
      `<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js">${close}` +
      `<script>window.PUBLISHED=${data};${close}<script id="app-src">${$('app-src').textContent}${close}</body></html>`;
    download(`${safeName()}_3D안내도.html`, html, 'text/html');
    toast('완성 안내도를 내려받았습니다.');
  }
  $('btnUndo').onclick = undo;
  $('btnSave').onclick = () => { download(`${safeName()}_제작파일.json`, JSON.stringify(project), 'application/json'); toast('제작 파일을 저장했습니다.'); };
  $('btnOpen').onclick = () => $('fileOpen').click();
  $('fileOpen').onchange = async (e) => {
    const f = e.target.files[0];
    e.target.value = '';
    if (!f) return;
    try {
      const d = JSON.parse(await f.text());
      if (!validProject(d)) throw new Error('invalid');
      project = d;
      project.items.forEach(ensureRooms);
      commit();
      rebuildAll();
      setStep('style');
    } catch (err) { toast('제작 파일이 아닙니다.'); }
  };
  $('btnHome').onclick = () => {
    if (step === 'done') { focus = { id: null, floor: null, room: null }; buildInterior(); applyFocus(); renderPanel(); }
    viewHome();
  };
  $('btnTop').onclick = viewTop;

  /* ========== 렌더 ========== */
  function resize() {
    const w = stage.clientWidth, h = stage.clientHeight;
    if (!w || !h) return;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(stage);
  const v = new THREE.Vector3();
  function updatePins() {
    const w = stage.clientWidth, h = stage.clientHeight;
    built.forEach((b, id) => {
      if (!b.pin) return;
      const it = getItem(id);
      if (!it) return;
      const top = isBuilding(it) ? it.floors * it.h + 2 : (isGate(it) ? 6.8 : 1.5);
      v.set(it.x, top, it.z).project(camera);
      const show = !b.hidden && v.z < 1 && Math.abs(v.x) < 1.02 && Math.abs(v.y) < 1.02;
      b.pin.style.display = show ? '' : 'none';
      if (show) b.pin.style.transform = `translate(${Math.round((v.x + 1) / 2 * w)}px, ${Math.round((1 - v.y) / 2 * h)}px) translate(-50%, -100%)`;
    });
  }
  function loop(now) {
    requestAnimationFrame(loop);
    if (tween) {
      const k = Math.min(1, (now - tween.t0) / 760);
      const ee = k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
      camera.position.lerpVectors(tween.p0, tween.p1, ee);
      controls.target.lerpVectors(tween.q0, tween.q1, ee);
      if (k >= 1) tween = null;
    }
    controls.update();
    animateMarker(now, stage.clientWidth, stage.clientHeight);
    renderer.render(scene, camera);
    updatePins();
  }

  if (PUB) $('tools').hidden = $('steps').hidden = true;
  if (PUB) { $('brand').textContent = `${project.name} 3D 안내도`; document.title = `${project.name} 3D 안내도`; }
  project.items.forEach(ensureRooms);
  history[0] = JSON.stringify(project);
  syncFinder();
  resize();
  rebuildAll();
  renderSteps();
  renderPanel();
  updateHint();
  updateTools();
  camera.position.copy(homePose());
  controls.target.set(0, 0, 0);
  controls.update();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
