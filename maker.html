    }
    const t = new THREE.CanvasTexture(c);
    t.encoding = THREE.sRGBEncoding;
    t.anisotropy = 4;
    return t;
  }

  function textPlane(text, w, h, bg, fg) {
    const c = document.createElement('canvas');
    c.width = 640; c.height = Math.round(640 * h / w);
    const g = c.getContext('2d');
    g.fillStyle = bg; g.fillRect(0, 0, c.width, c.height);
    g.fillStyle = fg; g.textAlign = 'center'; g.textBaseline = 'middle';
    let size = Math.round(c.height * .62);
    do { g.font = `800 ${size}px "Malgun Gothic","Apple SD Gothic Neo",sans-serif`; size -= 2; } while (g.measureText(text).width > c.width * .92 && size > 12);
    g.fillText(text, c.width / 2, c.height / 2 + 2);
    const t = new THREE.CanvasTexture(c);
    t.encoding = THREE.sRGBEncoding;
    t.anisotropy = 4;
    return new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: t, toneMapped: false }));

  const inkOn = (hex) => {

  /* ========== 건물·시설·소품 만들기 ========== */
  function buildBuilding(it, g) {
    const st = styleOf(it), capM = M(st.trim);
    const wallPhoto = it.photo && it.photoOnWalls && project.assets && project.assets[it.photo];
    let wallM;
    if (wallPhoto) {
      const tex = new THREE.TextureLoader().load(wallPhoto);
      tex.encoding = THREE.sRGBEncoding;
      tex.anisotropy = 4;
      wallM = new THREE.MeshLambertMaterial({ map: tex });
    } else wallM = wallMaterial(st);
    const floors = [];
    if (it.outline) {
      const pts = it.outline;
      for (let f = 0; f < it.floors; f++) {
        const fg = new THREE.Group();
        if (it.pilotis && f === 0) { buildPilotisFloor(fg, it, st); g.add(fg); floors.push(fg); continue; }
        const walls = new THREE.Mesh(polyWallGeometry(pts, f * it.h, (f + 1) * it.h, f, it.floors, !!wallPhoto), wallM);
        walls.castShadow = walls.receiveShadow = true;
        const cap = new THREE.Mesh(polyCapGeometry(pts, (f + 1) * it.h), capM);
        cap.castShadow = true;
        fg.add(walls, cap);
        g.add(fg);
        floors.push(fg);
      }
      const top = new THREE.Group(), y = it.floors * it.h;
      top.add(new THREE.Mesh(polyCapGeometry(pts, y + .08), M(st.roof)));
      pts.forEach((a, i) => edgeBox(top, a, pts[(i + 1) % pts.length], .55, .32, capM, y + .27));
      g.add(top);
      const entrances = new THREE.Group();
      (it.doors || []).forEach((door) => buildEntrance(entrances, it, st, door));
      g.add(entrances);
      g.userData.floors = floors;
      g.userData.top = top;
      return;
    }
    for (let f = 0; f < it.floors; f++) {
      if (it.pilotis && f === 0) { const fg = new THREE.Group(); buildPilotisFloor(fg, it, st); g.add(fg); floors.push(fg); continue; }
      const geo = new THREE.BoxGeometry(it.w, it.h, it.d);
      const uv = geo.attributes.uv;
      for (let i = 0; i < 24; i++) {
        const face = Math.floor(i / 4);
        if (face === 2 || face === 3) continue;
        if (wallPhoto) uv.setY(i, (f + uv.getY(i)) / it.floors);
        else uv.setX(i, uv.getX(i) * Math.max(1, Math.round((face < 2 ? it.d : it.w) / 4.5)));
      }
      const mesh = new THREE.Mesh(geo, [wallM, wallM, capM, capM, wallM, wallM]);
      mesh.position.y = f * it.h + it.h / 2;
      mesh.castShadow = mesh.receiveShadow = true;
      g.add(mesh);
      floors.push(mesh);
    }
    const top = new THREE.Group();
    const y = it.floors * it.h;
    if (st.roofType === 'flat') {
      box(top, it.w + .6, .55, it.d + .6, capM, 0, y + .27, 0);
      box(top, it.w - .8, .05, it.d - .8, M(st.roof), 0, y + .57, 0, true);
    } else {
      const span = it.d + 1.2, L = it.w + 1.2;
      const rise = st.roofType === 'gable' ? Math.min(it.d * .28, 6.5) : Math.min(it.d * .3, 8);
      const shape = new THREE.Shape();
      shape.moveTo(-span / 2, 0);
      if (st.roofType === 'gable') shape.lineTo(0, rise);
      else shape.absellipse(0, 0, span / 2, rise, Math.PI, 0, true);
      shape.lineTo(span / 2, 0);
      shape.closePath();
      const geo = new THREE.ExtrudeGeometry(shape, { depth: L, bevelEnabled: false, curveSegments: 22 });
      geo.rotateY(Math.PI / 2);
      geo.translate(-L / 2, y, 0);
      const roof = new THREE.Mesh(geo, M(st.roof));
      roof.castShadow = true;
      top.add(roof);
      box(top, it.w + .5, .3, it.d + .5, capM, 0, y + .05, 0);
    }
    const porchZ = it.d / 2;
    if (it.kind === 'main') {
      const sw = Math.min(24, it.w * .42), base = y + (st.roofType === 'flat' ? 1.7 : 1.7);
      const zFront = st.roofType === 'flat' ? porchZ - .2 : porchZ + .72;
      const yy = st.roofType === 'flat' ? base : it.h * (it.floors - .28);
      const sign = textPlane(project.name || '학교', sw, 2.2, st.trim, inkOn(st.trim));
      sign.position.set(0, yy, zFront + .08);
      box(top, sw + .3, 2.5, .14, M(st.roof), 0, yy, zFront);
      top.add(sign);
    }
    g.add(top);
    const entrances = new THREE.Group();
    (it.doors || []).forEach((door) => buildEntrance(entrances, it, st, door));
    g.add(entrances);
    g.userData.floors = floors;
    g.userData.top = top;
  }

  function pilotisColumns(parent, it, mat, height) {
    const poly = it.outline || [[-it.w / 2, -it.d / 2], [it.w / 2, -it.d / 2], [it.w / 2, it.d / 2], [-it.w / 2, it.d / 2]];
    const pts = [], inside = (p) => pointInPoly(p, poly);
    const add = (p) => { if (inside(p) && !pts.some((q) => Math.hypot(q[0] - p[0], q[1] - p[1]) < 3)) pts.push(p); };
    poly.forEach((a, i) => {
      const b = poly[(i + 1) % poly.length], dx = b[0] - a[0], dz = b[1] - a[1], len = Math.hypot(dx, dz) || 1;
      let nx = dz / len, nz = -dx / len;
      if (!inside([(a[0] + b[0]) / 2 + nx * .5, (a[1] + b[1]) / 2 + nz * .5])) { nx = -nx; nz = -nz; }
      const n = Math.max(1, Math.round(len / 8)), ux = dx / len, uz = dz / len;
      for (let k = 0; k <= n; k++) {
        const along = k === 0 ? .45 : k === n ? -.45 : 0;
        add([a[0] + dx * k / n + nx * .45 + ux * along, a[1] + dz * k / n + nz * .45 + uz * along]);
      }
    });
    const sx = Math.max(1, Math.round(it.w / 8)), sz = Math.max(1, Math.round(it.d / 8));
    for (let i = 1; i < sx; i++) for (let j = 1; j < sz; j++) add([-it.w / 2 + i * it.w / sx, -it.d / 2 + j * it.d / sz]);
    if (!pts.length) return;
    const m = new THREE.InstancedMesh(new THREE.BoxGeometry(.6, height, .6), mat, pts.length), mx = new THREE.Matrix4();
    pts.forEach((p, k) => m.setMatrixAt(k, mx.makeTranslation(p[0], height / 2, p[1])));
    m.instanceMatrix.needsUpdate = true;
    m.castShadow = true;
    parent.add(m);
  }
  function buildPilotisFloor(fg, it, st) {
    const pts = it.outline, trimM = M(st.trim);
    pilotisColumns(fg, it, M(st.wall), it.h - .4);
    if (pts) {
      fg.add(new THREE.Mesh(polyCapGeometry(pts, it.h - .42), new THREE.MeshLambertMaterial({ color: st.trim, side: THREE.DoubleSide })));
      pts.forEach((a, i) => edgeBox(fg, a, pts[(i + 1) % pts.length], .42, .3, trimM, it.h - .21));
      fg.add(new THREE.Mesh(polyCapGeometry(pts, .04), M('#d6d1c4')));
    } else {
      box(fg, it.w, .42, it.d, trimM, 0, it.h - .21, 0);
      box(fg, it.w, .06, it.d, M('#d6d1c4'), 0, .03, 0, true);
    }
  }
  function polyWallGeometry(pts, y0, y1, floorIndex, floors, usePhoto) {
    const pos = [], nor = [], uv = [];
    let run = 0;
    pts.forEach((a, i) => {
      const b = pts[(i + 1) % pts.length], dx = b[0] - a[0], dz = b[1] - a[1], len = Math.hypot(dx, dz) || 1;
      const nx = -dz / len, nz = dx / len, bays = Math.max(1, Math.round(len / 4.5));
      const u0 = usePhoto ? 0 : run, u1 = usePhoto ? 1 : run + bays;
      const v0 = usePhoto ? floorIndex / floors : 0, v1 = usePhoto ? (floorIndex + 1) / floors : 1;
      pos.push(a[0], y0, a[1], b[0], y0, b[1], b[0], y1, b[1], a[0], y0, a[1], b[0], y1, b[1], a[0], y1, a[1]);
      for (let k = 0; k < 6; k++) nor.push(nx, 0, nz);
      uv.push(u0, v0, u1, v0, u1, v1, u0, v0, u1, v1, u0, v1);
      run += bays;
    });
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
    return g;
  }
  function polyCapGeometry(pts, y) {
    const tris = THREE.ShapeUtils.triangulateShape(pts.map((p) => new THREE.Vector2(p[0], p[1])), []);
    const pos = [], nor = [];
    tris.forEach(([i, j, k]) => {
      let a = pts[i], b = pts[j], c = pts[k];
      if ((b[1] - a[1]) * (c[0] - a[0]) - (b[0] - a[0]) * (c[1] - a[1]) < 0) [b, c] = [c, b];
      pos.push(a[0], y, a[1], b[0], y, b[1], c[0], y, c[1]);
      nor.push(0, 1, 0, 0, 1, 0, 0, 1, 0);
    });
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(new Array(pos.length / 3 * 2).fill(0), 2));
    return g;
  }
  function edgeBox(parent, a, b, h, thick, mat, y) {
    const dx = b[0] - a[0], dz = b[1] - a[1], len = Math.hypot(dx, dz);
    const m = box(parent, len + thick, h, thick, mat, (a[0] + b[0]) / 2, y, (a[1] + b[1]) / 2);
    m.rotation.y = -Math.atan2(dz, dx);
    return m;
  }
  function buildEntrance(parent, it, st, door) {

    } else {
      box(e, 1.25, 2.2, .16, M('#3f8f5f'), 0, 1.1, .06);
      box(e, .12, .08, .08, M('#f2f2ec'), .4, 1.05, .16, true);

  /* ========== 내부 교실과 3D 표찰 ========== */
  const plates = new Map();
  let interior = null;
  const roomsOf = (it, f) => (it.rooms && it.rooms[f]) || [];
  const roomCode = (f, i) => `${f + 1}${String(i + 1).padStart(2, '0')}`;
  const roomBadge = (room, f, i) => (room.type === 'elevator' ? 'EV' : room.type === 'wc' ? 'WC' : room.type === 'stairs' ? 'ST' : roomCode(f, i));

      for (let radius = 0; radius <= 200 && !spot; radius += 4) {
        for (let a = 0; a < (radius ? 24 : 1) && !spot; a++) {
          const [x, z] = clampPos(it, cx + Math.cos(a / 24 * Math.PI * 2) * radius, cz + Math.sin(a / 24 * Math.PI * 2) * radius);
          if (!overlaps(it, x, z)) { spot = [x, z]; if (radius) moved++; }
        }
      }
      if (!spot) { project = prev; throw new Error('no space'); }
      [it.x, it.z] = spot;
      next.items.push(it);
    });
    project = prev;
    return { next, moved };
  }
  $('fileOpen').onchange = async (e) => {
    const f = e.target.files[0];
    e.target.value = '';
    if (!f) return;
    try {
      const text = await f.text();
      const raw = JSON.parse(text.slice(text.indexOf('{'), text.lastIndexOf('}') + 1));
      const legacy = raw && Array.isArray(raw.buildings) && raw.buildings.every((b) => Array.isArray(b.outline) && b.outline.length >= 3);
      if (!legacy && !validProject(raw)) throw new Error('invalid');
      if (project.items.length && !confirm('지금 작업 중인 내용을 불러온 파일로 바꿀까요? 필요하면 먼저 저장해 주세요.')) return;
      let moved = 0;
      if (legacy) {
        const r = fromLegacy(raw);
        project = r.next;
        moved = r.moved;
      } else project = raw;
      project.items.forEach(ensureRooms);
      focus = { id: null, floor: null, room: null };
      commit();
      assetsChanged();
      rebuildAll();
      setStep('style');
      if (legacy) toast(moved ? `불러왔습니다. 겹치는 건물 ${moved}개는 위치를 옮겼습니다.` : '이전 안내도를 불러왔습니다.');
    } catch (err) { toast('제작 파일이나 이전 안내도 파일이 아닙니다.'); }
  };
  $('fileGround').onchange = async (e) => {
    const f = e.target.files[0];
    e.target.value = '';
    if (!f) return;
    try {
      const img = await readImage(f, 1800, .8);
      project.ground = { image: addAsset(img.data), w: img.w, h: img.h };
      buildGround();
      commit();
      assetsChanged();
      renderPanel();
      viewTop();
      toast('배치도를 올렸습니다. 새 건물 직접 그리기로 건물을 따라 그려 보세요.');
    } catch (err) { toast(err.message); }
  };
  $('filePhoto').onchange = async (e) => {
    const f = e.target.files[0];
    e.target.value = '';
    const it = getItem(photoTarget);
    photoTarget = null;
    if (!f || !it) return;
    try {
      const img = await readImage(f, 1280, .82);
      it.photo = addAsset(img.data);
      it.photoOnWalls = true;
      rebuildItem(it);
      applyFocus();
      updateSelection();
      commit();
      assetsChanged();
      renderPanel();
    } catch (err) { toast(err.message); }
  };
  $('btnHome').onclick = () => {
    if (step === 'done') { focus = { id: null, floor: null, room: null }; buildInterior(); applyFocus(); renderPanel(); }
    viewHome();
  };
  $('btnTop').onclick = viewTop;

  /* ========== 렌더 ========== */
  function resize() {
    const w = stage.clientWidth, h = stage.clientHeight;
    if (!w || !h) return;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(stage);
  const v = new THREE.Vector3();
  const labelCache = new WeakMap();
  function labelPoint(it) {
    if (!it.outline) return [it.x, it.z];
    if (!labelCache.has(it.outline)) {
      const g = gridOf(it), n = it.outline.length;
      const cx = it.outline.reduce((a, p) => a + p[0], 0) / n, cz = it.outline.reduce((a, p) => a + p[1], 0) / n;
      let best = [cx, cz], dist = pointInPoly([cx, cz], it.outline) ? -1 : Infinity;
      if (dist > 0) {
        g.mask.forEach((row, r) => row.forEach((ok, c) => {
          if (!ok) return;
          const x = -it.w / 2 + (c + .5) * g.cw, z = -it.d / 2 + (r + .5) * g.ch, q = Math.hypot(x - cx, z - cz);
          if (q < dist) { dist = q; best = [x, z]; }
        }));
      }
      labelCache.set(it.outline, best);
    }
    const p = labelCache.get(it.outline);
    return worldPoly({ outline: [p] }, it.x, it.z, it.rot)[0];
  }
  function updatePins() {
    const w = stage.clientWidth, h = stage.clientHeight;
    built.forEach((b, id) => {
      if (!b.pin) return;
      const it = getItem(id);
      if (!it) return;
      const top = isBuilding(it) ? it.floors * it.h + 2 : (isGate(it) ? 6.8 : 1.5);
      const [px, pz] = labelPoint(it);
      v.set(px, top, pz).project(camera);
      const show = !b.hidden && v.z < 1 && Math.abs(v.x) < 1.02 && Math.abs(v.y) < 1.02;
      b.pin.style.display = show ? '' : 'none';
      if (show) b.pin.style.transform = `translate(${Math.round((v.x + 1) / 2 * w)}px, ${Math.round((1 - v.y) / 2 * h)}px) translate(-50%, -100%)`;
    });
  }
  function loop(now) {
    requestAnimationFrame(loop);
    if (tween) {
      const k = Math.min(1, (now - tween.t0) / 760);
      const ee = k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
      camera.position.lerpVectors(tween.p0, tween.p1, ee);
      controls.target.lerpVectors(tween.q0, tween.q1, ee);
      if (k >= 1) tween = null;
    }
    controls.update();
    animateMarker(now, stage.clientWidth, stage.clientHeight);
    renderer.render(scene, camera);
    updatePins();
  }

  if (PUB) $('tools').hidden = $('steps').hidden = true;
  if (PUB) { $('brand').textContent = `${project.name} 3D 안내도`; document.title = `${project.name} 3D 안내도`; }
  project.items.forEach(ensureRooms);
  history[0] = snapshot();
  syncFinder();
  resize();
  rebuildAll();
  renderSteps();
  renderPanel();
  updateHint();
  updateTools();
  camera.position.copy(homePose());
  controls.target.set(0, 0, 0);
  controls.update();
  requestAnimationFrame(loop);
  if (!PUB) {
    readAssets().then((stored) => {
      if (!Object.keys(stored).length) return;
      project.assets = Object.assign({}, stored, project.assets);
      rebuildAll();
      renderPanel();
    }).catch(() => {});
  }
})();
</script>
